[package]
name = "oxideav-mkv"
version = "0.0.11"
edition = "2021"
rust-version = "1.80"
license = "MIT"
repository = "https://github.com/OxideAV/oxideav-mkv"
authors = ["Mark Karpeles"]
description = "Pure-Rust Matroska (MKV/WebM) container for oxideav"

readme = "README.md"
homepage = "https://github.com/OxideAV/oxideav-mkv"
keywords = ["multimedia", "mkv", "matroska", "webm", "pure-rust"]
categories = ["multimedia::video", "parser-implementations"]

[dependencies]
oxideav-core = "0.1"
# `compcol` (Karpelès Lab's compression collection, the workspace-wide
# choice for byte-stream codecs) undoes the ContentEncodings compression
# algorithms of RFC 9559 §5.1.4.1.31.6: zlib, bzip2 and LZO1X.
compcol = { version = "0.6", default-features = false, features = ["zlib", "bzip2", "lzo"] }

[dev-dependencies]
oxideav-basic = "0.0"
